<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome!</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #2563eb);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome {
      background: rgba(255, 255, 255, 0.1);
      padding: 50px 30px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      max-width: 600px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
    }

    button {
      margin-top: 25px;
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #2563eb;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="welcome">
    <h1>👋 Welcome!</h1>
    <p>Welcome to WEBSITESORGOKK.</p>
    <p>WEBSITESORGOKK is a website maker via HTML code and AI. For example, this was made by AI and then edited.</p></p
                                 
  </div> 

  <script>
    function sayHello() {
      alert("Welcome! 🎉");
    }
  </script>

</body>
</html>
